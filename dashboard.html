<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Sistema de Gestión Fiscal RD v4.0</title>

    <link rel="stylesheet" href="css/dashboard.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="header">

    <div class="logo">
        <h1>📊 Sistema de Gestión Fiscal RD</h1>
        <p>Versión 4.0 Profesional</p>
    </div>

    <div class="acciones">

        <button id="btnModoOscuro">
            🌙 Modo Oscuro
        </button>

        <button id="btnCerrarSesion">
            🚪 Cerrar sesión
        </button>

    </div>

</header>

<main class="contenedor">

    <!-- Estadísticas -->

    <section class="estadisticas">

        <div class="card-estadistica">
            <h3>Operaciones</h3>
            <span id="totalOperaciones">0</span>
        </div>

        <div class="card-estadistica">
            <h3>ITBIS</h3>
            <span id="totalITBIS">0</span>
        </div>

        <div class="card-estadistica">
            <h3>ISR</h3>
            <span id="totalISR">0</span>
        </div>

        <div class="card-estadistica">
            <h3>Ahorros</h3>
            <span id="totalAhorro">0</span>
        </div>

    </section>

    <!-- Tarjetas -->

    <section class="menu-modulos">

        <div class="card-modulo">

            <h2>💰 ITBIS</h2>

            <p>Calculadora del ITBIS.</p>

            <button onclick="mostrarModulo('itbis')">
                Abrir módulo
            </button>

        </div>

        <div class="card-modulo">

            <h2>📈 ISR</h2>

            <p>Calculadora de ISR.</p>

            <button onclick="mostrarModulo('isr')">
                Abrir módulo
            </button>

        </div>

        <div class="card-modulo">

            <h2>💵 Ahorro</h2>

            <p>Regla financiera 50/30/20.</p>

            <button onclick="mostrarModulo('ahorro')">
                Abrir módulo
            </button>

        </div>

        <div class="card-modulo">

            <h2>📜 Historial</h2>

            <p>Historial de operaciones.</p>

            <button onclick="mostrarModulo('historial')">
                Abrir módulo
            </button>

        </div>

    </section>

    <!-- Panel -->

    <section class="panel">

        <div id="modulo-itbis" class="modulo" hidden></div>

        <div id="modulo-isr" class="modulo" hidden></div>

        <div id="modulo-ahorro" class="modulo" hidden></div>

        <div id="modulo-historial" class="modulo" hidden></div>

    </section>

</main>

<footer>

    <p>© 2026 Sistema de Gestión Fiscal RD</p>

</footer>

<script src="js/dashboard.js"></script>
<script src="js/itbis.js"></script>
<script src="js/isr.js"></script>
<script src="js/ahorro.js"></script>
<script src="js/historial.js"></script>
<script src="js/exportar.js"></script>

</body>
</html>
